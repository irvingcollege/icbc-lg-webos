name: webOS checks
on: [push, pull_request, workflow_dispatch]
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
        env:
          CHROMIUM_PATH: ''
          PLAYWRIGHT_BUNDLED: '1'
      - run: npm run package
      - run: npm run verify:ipk
      - uses: actions/upload-artifact@v4
        with:
          name: icbc-lg-webos-ipk
          path: artifacts/*.ipk
