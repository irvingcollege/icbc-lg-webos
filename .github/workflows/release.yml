name: Publish development package
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['downloads/**', '.github/workflows/release.yml']
permissions:
  contents: write
concurrency:
  group: publish-development-package
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check package checksums
        working-directory: downloads
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo 'Release v1.0.0 already exists; leaving it unchanged.'
          else
            gh release create v1.0.0 \
              downloads/church.irvingcollege.icbc_1.0.0_all.ipk \
              downloads/icbc-lg-webos-source-1.0.0.zip \
              downloads/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title 'ICBC LG webOS 1.0.0 — development prerelease' \
              --prerelease \
              --notes-file docs/release-1.0.0.md
          fi
